    background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}

  header.top{background:linear-gradient(135deg,var(--navy),#16294a);color:#fff;padding:26px 20px 22px}

  header.top h1{margin:0;font-size:1.5rem;letter-spacing:.2px}

  nav.papers{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  nav.papers button{border:0;cursor:pointer;font:inherit;font-weight:600;padding:8px 13px;border-radius:999px;

  nav.papers button:hover{background:rgba(255,255,255,.26)}
  nav.papers button.active{background:#fff;color:var(--navy)}
  nav.papers button .g{font-size:.72rem;opacity:.75;font-weight:700}

  .home-intro .sched{color:var(--muted);font-size:.9rem}

  .pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;

  .pcard .row1{display:flex;align-items:center;gap:10px}

  .pcard .grp{margin-left:auto;font-size:.72rem;font-weight:700;color:var(--blue);background:var(--light);padding:3px 9px;border-radius:999px}
  .pcard h3{margin:0;font-size:1.02rem;line-height:1.3}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:18px}
  .tabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;padding:9px 14px;border-radius:8px 8px 0 0;position:relative;top:2px}
  .tabs button.active{color:var(--blue);border-bottom:3px solid var(--blue)}
  .tabs button:hover{color:var(--ink)}
  .panel{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .msg{background:var(--light);border-radius:12px;padding:15px 17px;margin-bottom:14px}
  .msg .lab{font-weight:700;color:var(--navy);display:block;margin-bottom:3px;font-size:.8rem;text-transform:uppercase;letter-spacing:.4px}
  .primer{border:1px dashed var(--blue);border-radius:12px;padding:13px 16px;font-size:.9rem;color:var(--ink)}

  .steps{display:flex;flex-direction:column;gap:0}
  .stepc{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .stepc:last-child{border-bottom:0}
  .stepc .num{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
  .stepc .fig{font-weight:700;color:var(--navy)}
  .stepc .figlab{color:var(--blue);font-weight:600;font-size:.86rem}
  .stepc .txt{font-size:.92rem;color:var(--ink);margin-top:2px}
  .stepc .look{font-size:.84rem;color:var(--muted);margin-top:5px;background:var(--light);border-radius:8px;padding:6px 10px}

  .flip-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}

  .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:15px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow);border:1px solid var(--line)}

  .face.back .term{font-weight:700;color:var(--blue);font-size:.82rem;margin-bottom:5px}

  .qbar{flex:1;height:9px;background:var(--line);border-radius:99px;overflow:hidden}
  .qbar > i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
  .qbar-label{font-size:.82rem;color:var(--muted);font-weight:600;white-space:nowrap}
  .q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}

  .opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:10px 13px;border-radius:9px;margin-bottom:8px;cursor:pointer;transition:.12s}

  .retry{margin-top:12px;background:#fff;color:var(--navy);border:0;font:inherit;font-weight:700;padding:9px 18px;border-radius:999px;cursor:pointer}
  .aside-box{border-left:3px solid var(--muted);padding:8px 14px;color:var(--muted);font-size:.88rem;background:var(--light);border-radius:0 10px 10px 0;margin-top:6px}

  @media (prefers-color-scheme: dark){.viz-stage{background:#0e1830;border-color:#243452}}
  .vzsvg{width:100%;height:auto;display:block}
  .vznode .bx{fill:#eef2f8;stroke:#94a3b8;stroke-width:1.5;transition:.3s}
  .vznode .lbl{fill:#1c2530;font:600 13px -apple-system,'Segoe UI',sans-serif;transition:.3s}
  .vznode.t-enzyme .bx{fill:#dcebff;stroke:#2e74b5}
  .vznode.t-product .bx{fill:#e2f6ec;stroke:#1a8f5a}
  .vznode.t-organ  .bx{fill:#fdeecf;stroke:#d98a2b}
  .vznode.t-bad    .bx{fill:#fbe3e0;stroke:#c0392b}
  @media (prefers-color-scheme: dark){
    .vznode .bx{fill:#1c2b44;stroke:#3f5578}
    .vznode .lbl{fill:#e9eef6}
    .vznode.t-enzyme .bx{fill:#173154;stroke:#4f8fd0}
    .vznode.t-product .bx{fill:#123626;stroke:#3ba676}
    .vznode.t-organ  .bx{fill:#3a2c12;stroke:#c98a35}
    .vznode.t-bad    .bx{fill:#3a1b18;stroke:#c85a4e}
  }
  .vznode{cursor:default}
  .vznode.lit .bx{stroke-width:3.4;filter:drop-shadow(0 0 6px rgba(224,138,30,.6))}
  .vznode.lit .bx.pulse{animation:vzpulse 1.4s ease-in-out infinite}
  @keyframes vzpulse{0%,100%{filter:drop-shadow(0 0 3px rgba(224,138,30,.35))}50%{filter:drop-shadow(0 0 9px rgba(224,138,30,.75))}}
  .vznode.dim{opacity:.22}
  .vzedge{stroke:#7c8aa0;stroke-width:2;fill:none;transition:.3s}
  .vzedge.dash{stroke-dasharray:5 5}
  .vzedge.dim{opacity:.12}
  .vzdot{transition:.3s}
  .vzdot.flow{fill:#2e74b5}
  .vzdot.nad{fill:#e08a1e}
  .vzdot.good{fill:#1a8f5a}
  .vzdot.bad{fill:#c0392b}
  .vzdot.dim{opacity:0}
  .viz-controls{display:flex;align-items:center;gap:10px;margin:14px 0 10px;flex-wrap:wrap}
  .viz-controls button{border:0;background:var(--blue);color:#fff;font:inherit;font-weight:700;padding:8px 15px;border-radius:999px;cursor:pointer}
  .viz-controls button.ghost{background:var(--light);color:var(--navy)}
  .viz-controls button:disabled{opacity:.4;cursor:default}
  .viz-dots{display:flex;gap:6px;margin-left:auto}
  .viz-dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
  .viz-dots i.on{background:var(--blue)}
  .viz-cap{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:0 10px 10px 0;padding:12px 15px;font-weight:600;min-height:20px}
  .viz-cap .cnum{color:var(--blue);font-weight:800;margin-right:8px}
  .viz-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:.82rem;color:var(--muted)}
  .viz-legend span{display:inline-flex;align-items:center;gap:6px}
  .viz-legend b{width:11px;height:11px;border-radius:50%;display:inline-block}
  .lg-flow{background:#2e74b5}.lg-nad{background:#e08a1e}.lg-good{background:#1a8f5a}.lg-bad{background:#c0392b}
  .hidden{display:none!important}
</style>

<script>
(function(){
  const P = window.PAPERS, G = window.GUIDANCE, VIZ = window.VIZ||{};
  const view = document.getElementById('view');
  const nav = document.getElementById('paper-nav');
  document.getElementById('site-title').textContent = G.title + " — Study Guide";
  document.getElementById('site-sub').textContent = G.course;
  document.title = "VET67-206 · " + G.title;
  const NS="http://www.w3.org/2000/svg";
  let vizTimer=null;

  const homeBtn = mkNavBtn("★ Home", "__home");
  nav.appendChild(homeBtn);
  P.forEach(p=>nav.appendChild(mkNavBtn(p.letter, p.letter, p.group)));
  nav.appendChild(mkNavBtn("Glossary", "__glossary"));

  function mkNavBtn(label, key, grp){
    const b=document.createElement('button');
    b.dataset.key = key;
    if(grp){ b.innerHTML = label + ' <span class="g">G'+grp+'</span>'; } else b.textContent = label;
    b.onclick=()=>route(b.dataset.key);
    return b;
  }
  function setActive(key){[...nav.children].forEach(b=>b.classList.toggle('active', b.dataset.key===key));}
  function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

  function route(key){
    if(vizTimer){clearInterval(vizTimer);vizTimer=null;}
    window.scrollTo({top:0,behavior:'smooth'});
    if(key==="__home"||!key){ setActive("__home"); renderHome(); return; }
    if(key==="__glossary"){ setActive("__glossary"); renderGlossary(); return; }
    setActive(key);
    renderPaper(P.find(p=>p.letter===key));
  }

  function renderHome(){
    let tips = G.tips.map(t=>`<li>${esc(t)}</li>`).join('');
    let cards = P.map(p=>`
      <button class="pcard" onclick="__go('${p.letter}')">
        <div class="row1"><span class="badge">${p.letter}</span><span class="grp">Group ${p.group}</span></div>
        <h3>${esc(p.title)}</h3><div class="tagline">${esc(p.tag)}</div>
      </button>`).join('');
    view.innerHTML = `
      <div class="home-intro">
        <p>${esc(G.intro)}</p>
        <p class="sched"><strong>Schedule:</strong> ${esc(G.schedule)}</p>
        <h4 class="sec" style="margin-top:16px">How to give a good talk</h4>
        <ul class="tips">${tips}</ul>
      </div>
      <h4 class="sec">Choose your paper</h4>
      <div class="grid">${cards}</div>`;
  }

  function renderPaper(p){
    const hasViz = !!VIZ[p.letter];
    view.innerHTML = `
      <button class="back-btn" onclick="__go('__home')">← All papers</button>
      <div class="paper-head">
        <span class="badge">${p.letter}</span>
        <div><h2>${esc(p.title)}</h2><div class="tagline">${esc(p.tag)}</div></div>
        <span class="grp">Group ${p.group}</span>
      </div>
      <div class="cite">${esc(p.citation)}</div>
      <div class="tabs" id="ptabs">
        <button data-t="overview" class="active">Overview</button>
        ${hasViz?'<button data-t="viz">▶ Visualize</button>':''}
        <button data-t="figures">Figure walkthrough</button>
        <button data-t="cards">Flashcards</button>
        <button data-t="quiz">Self-quiz</button>
      </div>
      <div id="pbody"></div>`;
    const tabs=[...document.querySelectorAll('#ptabs button')];
    tabs.forEach(t=>t.onclick=()=>{
      if(vizTimer){clearInterval(vizTimer);vizTimer=null;}
      tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');paperTab(p,t.dataset.t);
    });
    paperTab(p,'overview');
  }

  function paperTab(p,t){
    const body=document.getElementById('pbody');
    if(t==='overview'){
      body.innerHTML=`<div class="panel">
        <div class="msg"><span class="lab">Message to deliver</span>${esc(p.message)}</div>
        <div class="primer">${esc(p.primer)}</div>
        <h4 class="sec" style="margin-top:18px">Set aside (don't over-invest)</h4>
        <div class="aside-box">${esc(p.setAside)}</div></div>`;
    } else if(t==='viz'){ renderViz(p,body); }
    else if(t==='figures'){
      const steps=p.figures.map((f,i)=>`
        <div class="stepc"><div class="num">${i+1}</div>
          <div><span class="fig">${esc(f.fig)}</span> — <span class="figlab">${esc(f.label)}</span>
          <div class="txt">${esc(f.text)}</div>
          ${f.look?`<div class="look"><b>Look for:</b> ${esc(f.look)}</div>`:''}</div></div>`).join('');
      body.innerHTML=`<div class="panel"><h4 class="sec">Present these, in this order</h4><div class="steps">${steps}</div></div>`;
    } else if(t==='cards'){
      const cards=p.concepts.map(c=>`
        <div class="flip" onclick="this.classList.toggle('flipped')">
          <div class="flip-in">
            <div class="face front"><div class="term">${esc(c.term)}</div><span class="hint">tap to flip</span></div>
            <div class="face back"><div class="term">${esc(c.term)}</div>${esc(c.def)}</div>
          </div></div>`).join('');
      body.innerHTML=`<div class="panel"><h4 class="sec">Key concepts — tap to reveal (${p.concepts.length})</h4><div class="cards">${cards}</div></div>`;
    } else if(t==='quiz'){ renderQuiz(p,body); }
  }

  /* ---------- VISUALIZE ---------- */
  function renderViz(p,body){
    const v=VIZ[p.letter];
    body.innerHTML=`<div class="panel viz-wrap">
      <h4 class="sec">Watch the biochemistry — ${p.figures.length? 'step through the pathway':''}</h4>
      <div class="viz-stage" id="vizStage"></div>
      <div class="viz-controls">
        <button class="ghost" id="vzPrev">‹ Prev</button>
        <button id="vzPlay">▶ Play</button>
        <button class="ghost" id="vzNext">Next ›</button>
        <div class="viz-dots" id="vzDots"></div>
      </div>
      <div class="viz-cap" id="vzCap"></div>
      <div class="viz-legend" id="vzLeg"></div>
    </div>`;
    const stage=document.getElementById('vizStage');
    const svg=buildSVG(v);
    stage.appendChild(svg);
    // legend
    document.getElementById('vzLeg').innerHTML = (v.legend||[]).map(l=>`<span><b class="lg-${l.c}"></b>${esc(l.t)}</span>`).join('');
    // dots
    const dotsC=document.getElementById('vzDots');
    v.steps.forEach((s,i)=>{const d=document.createElement('i');d.onclick=()=>go(i);dotsC.appendChild(d);});
    let cur=-1, playing=false;
    const cap=document.getElementById('vzCap');
    function applyStep(i){
      const on = v.steps[i].on||[];
      const set = new Set(on);
      svg.querySelectorAll('.vznode').forEach(g=>{
        const id=g.dataset.id;
        g.classList.toggle('lit', set.has(id));
        g.classList.toggle('dim', on.length>0 && !set.has(id));
      });
      svg.querySelectorAll('.vzedge').forEach(e=>{
        const lit = on.length===0 || (set.has(e.dataset.a)&&set.has(e.dataset.b));
        e.classList.toggle('dim', on.length>0 && !lit);
      });
      svg.querySelectorAll('.vzdot').forEach(dt=>{
        const lit = on.length===0 || (set.has(dt.dataset.a)&&set.has(dt.dataset.b));
        dt.classList.toggle('dim', on.length>0 && !lit);
      });
      [...dotsC.children].forEach((d,di)=>d.classList.toggle('on',di===i));
      cap.innerHTML=`<span class="cnum">${i+1}/${v.steps.length}</span>${esc(v.steps[i].t)}`;
      cur=i;
      document.getElementById('vzPrev').disabled=(i===0);
      document.getElementById('vzNext').disabled=(i===v.steps.length-1);
    }
    function go(i){ if(i<0||i>=v.steps.length)return; applyStep(i); }
    function stop(){ playing=false; if(vizTimer){clearInterval(vizTimer);vizTimer=null;} document.getElementById('vzPlay').textContent='▶ Play'; }
    function play(){
      if(playing){stop();return;}
      playing=true; document.getElementById('vzPlay').textContent='❚❚ Pause';
      if(cur>=v.steps.length-1) applyStep(0);
      vizTimer=setInterval(()=>{
        if(cur>=v.steps.length-1){stop();return;}
        applyStep(cur+1);
      },2600);
    }
    document.getElementById('vzPrev').onclick=()=>{stop();go(cur-1);};
    document.getElementById('vzNext').onclick=()=>{stop();go(cur+1);};
    document.getElementById('vzPlay').onclick=play;
    applyStep(0);
  }

  function buildSVG(v){
    const svg=document.createElementNS(NS,'svg');
    svg.setAttribute('viewBox',`0 0 ${v.w} ${v.h}`);
    svg.setAttribute('class','vzsvg');
    // arrow marker
    const defs=document.createElementNS(NS,'defs');
    defs.innerHTML=`<marker id="vzarw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7c8aa0"/></marker>`;
    svg.appendChild(defs);
    const byId={}; v.nodes.forEach(n=>byId[n.id]=n);
    function rect(n){ const w=n.w||150, h=n.h||46; return {x:n.x-w/2,y:n.y-h/2,w,h}; }
    function edgePts(a,b){
      const ra=rect(a), rb=rect(b);
      const ax=a.x, ay=a.y, bx=b.x, by=b.y;
      const dx=bx-ax, dy=by-ay;
      function exit(r,cx,cy,dx,dy){
        if(dx===0&&dy===0)return{x:cx,y:cy};
        const hw=r.w/2,hh=r.h/2;
        const tx=dx!==0?hw/Math.abs(dx):1e9, ty=dy!==0?hh/Math.abs(dy):1e9;
        const t=Math.min(tx,ty); return {x:cx+dx*t,y:cy+dy*t};
      }
      const s=exit(ra,ax,ay,dx,dy), e=exit(rb,bx,by,-dx,-dy);
      return {s,e};
    }
    // edges
    v.edges.forEach((ed,i)=>{
      const a=byId[ed.from], b=byId[ed.to];
      const {s,e}=edgePts(a,b);
      const path=document.createElementNS(NS,'path');
      const d=`M ${s.x.toFixed(1)} ${s.y.toFixed(1)} L ${e.x.toFixed(1)} ${e.y.toFixed(1)}`;
      path.setAttribute('d',d);
      path.setAttribute('class','vzedge'+(ed.dash?' dash':''));
      path.setAttribute('marker-end','url(#vzarw)');
      path.dataset.a=ed.from; path.dataset.b=ed.to;
      svg.appendChild(path);
      // flowing dot
      const dot=document.createElementNS(NS,'circle');
      dot.setAttribute('r','4.5');
      dot.setAttribute('class','vzdot '+(ed.kind||'flow'));
      dot.dataset.a=ed.from; dot.dataset.b=ed.to;
      const anim=document.createElementNS(NS,'animateMotion');
      anim.setAttribute('dur',(2+ (i%3)*0.4).toFixed(1)+'s');
      anim.setAttribute('repeatCount','indefinite');
      anim.setAttribute('path',d);
      dot.appendChild(anim);
      svg.appendChild(dot);
    });
    // nodes
    v.nodes.forEach(n=>{
      const r=rect(n);
      const g=document.createElementNS(NS,'g');
      g.setAttribute('class','vznode t-'+(n.type||'signal'));
      g.dataset.id=n.id;
      const box=document.createElementNS(NS,'rect');
      box.setAttribute('x',r.x);box.setAttribute('y',r.y);box.setAttribute('width',r.w);box.setAttribute('height',r.h);
      box.setAttribute('rx','11');box.setAttribute('class','bx pulse');
      g.appendChild(box);
      const lines=(n.label||'').split('\n');
      const t=document.createElementNS(NS,'text');
      t.setAttribute('x',n.x);t.setAttribute('y',n.y);t.setAttribute('text-anchor','middle');
      t.setAttribute('class','lbl');
      const startDy=-((lines.length-1)*7);
      lines.forEach((ln,li)=>{
        const ts=document.createElementNS(NS,'tspan');
        ts.setAttribute('x',n.x);ts.setAttribute('dy',(li===0?startDy+4:15));
        ts.textContent=ln; t.appendChild(ts);
      });
      g.appendChild(t);
      svg.appendChild(g);
    });
    return svg;
  }

  /* ---------- QUIZ ---------- */
  function renderQuiz(p,body){
    const total=p.quiz.length;
    body.innerHTML=`<div class="panel">
      <div class="quiz-top"><div class="qbar"><i id="qfill"></i></div><div class="qbar-label" id="qlab">0 / ${total} answered</div></div>
      <div id="qlist"></div>
      <div class="quiz-done" id="qdone"></div></div>`;
    const list=document.getElementById('qlist');
    const st={answered:0,correct:0,total};
    p.quiz.forEach((item,qi)=>{
      const wrap=document.createElement('div');wrap.className='q';
      wrap.innerHTML=`<div class="qtext">${qi+1}. ${esc(item.q)}</div>`;
      const opts=[];
      item.options.forEach((o,oi)=>{
        const btn=document.createElement('button');btn.className='opt';btn.textContent=o;
        btn.onclick=()=>{
          if(wrap.dataset.done)return;
          wrap.dataset.done="1";st.answered++;
          opts.forEach(b=>b.disabled=true);
          if(oi===item.answer){btn.classList.add('correct');st.correct++;}
          else{btn.classList.add('wrong');opts[item.answer].classList.add('correct');}
          exp.classList.add('show');
          document.getElementById('qfill').style.width=(st.answered/total*100)+'%';
          document.getElementById('qlab').textContent=`${st.answered} / ${total} answered`;
          if(st.answered===total) finish();
        };
        opts.push(btn);wrap.appendChild(btn);
      });
      const exp=document.createElement('div');exp.className='explain';exp.textContent="Why: "+item.explain;
      wrap.appendChild(exp);list.appendChild(wrap);
    });
    function finish(){
      const pct=Math.round(st.correct/total*100);
      const msg = pct===100?"Perfect — you've got this paper.":pct>=70?"Solid understanding.":pct>=40?"Good start — review the flashcards.":"Revisit the overview and flashcards, then retry.";
      const d=document.getElementById('qdone');
      d.innerHTML=`<div class="big">${st.correct} / ${total}</div><div>${msg}</div><button class="retry" onclick="__go('${p.letter}')">↻ Retry quiz</button>`;
      d.classList.add('show');
      d.scrollIntoView({behavior:'smooth',block:'center'});
    }
  }

  function renderGlossary(){
    const all=[];
    P.forEach(p=>p.concepts.forEach(c=>all.push({t:c.term,d:c.def,p:p.letter,g:p.group})));
    all.sort((a,b)=>a.t.localeCompare(b.t));
    view.innerHTML=`
      <button class="back-btn" onclick="__go('__home')">← All papers</button>
      <h2 style="margin:4px 0 4px">Glossary &amp; key molecules</h2>
      <p style="color:var(--muted);font-size:.9rem;margin-top:0">Every enzyme, pathway, and term across the seven papers (${all.length} entries). Search to filter.</p>
      <input class="search" id="gsearch" placeholder="Search terms, enzymes, pathways…">
      <div id="glist"></div>`;
    const glist=document.getElementById('glist');
    function draw(f){
      const q=(f||"").toLowerCase();
      glist.innerHTML=all.filter(x=>!q||x.t.toLowerCase().includes(q)||x.d.toLowerCase().includes(q))
        .map(x=>`<div class="gitem"><span class="gt">${esc(x.t)}</span><span class="gp">Paper ${x.p} · Group ${x.g}</span><div class="gd">${esc(x.d)}</div></div>`).join('')
        || `<p style="color:var(--muted)">No matches.</p>`;
    }
    draw("");
    document.getElementById('gsearch').oninput=e=>draw(e.target.value);
  }

  window.__go=route;
  route("__home");
})();
</script>
