  .back-btn{background:none;border:0;color:var(--blue);font:inherit;font-weight:600;cursor:pointer;padding:6px 0;margin-bottom:8px}
  .hidden{display:none!important}
</style>

    ],
    setAside: "Epigenetics mechanism (histone marks, KDM6A recruitment). Methods (ChIP-seq, CUT&Tag, RIME, RNA-seq, AAV-PCSK9). Sex-chromosome detail — one sentence: 'the regulator is X-linked, so the effect differs by sex.'"
  },
  {

      { fig: "Figure 1d", label: "BCAAs pile up", text: "With the mitochondrial step gone, intracellular leucine, isoleucine, and valine all rise — as predicted." },

    ],

      { term: "Branched-chain amino acids", def: "Leucine, isoleucine, valine — essential amino acids whose catabolism is tightly controlled." },

    ],

      { fig: "Figure 6", label: "Biochemistry heart (spend time)", text: "The four metabolic fates of proline, and the demonstration it's the PRODH catabolic route that maintains mitochondrial ROS balance and drives angiogenesis." },
      { fig: "Figure 7", label: "How redox control works", text: "Proline–PRODH catabolism keeps mtROS in a healthy range via a SIRT1 → SOD2 pathway; losing it lets ROS run high and angiogenesis fail." }
    ],
    concepts: [
      { term: "Proline catabolism (PRODH)", def: "PRODH oxidizes proline to P5C (pyrroline-5-carboxylate), which feeds glutamate and the TCA cycle for energy. The centerpiece reaction." },
      { term: "Four fates of proline", def: "(1) PRODH → P5C → TCA energy; (2) → polyamines via ornithine; (3) → prolyl-tRNA for collagen; (4) → hydroxyproline. One amino acid, several pathways." },
      { term: "Glutamate hub", def: "Proline, glutamate, and glutamine sit in one interconvertible pool — the same nitrogen-hub theme as transamination." },
      { term: "mtROS & SOD2", def: "ROS is a by-product of mitochondrial metabolism; SOD2 (superoxide dismutase 2) keeps it in check — the redox side of bioenergetics." },
      { term: "SIRT1 → SOD2", def: "SIRT1 (an NAD⁺-dependent deacetylase) activates SOD2 by removing acetyl groups — controlling an enzyme via post-translational modification, linked to NAD⁺/energy state." }
    ],
    quiz: [
      { q: "What does PRODH do to proline, and where does the product go?", options: ["Builds it into collagen", "Oxidizes it to P5C, feeding glutamate and the TCA cycle", "Converts it to glucose directly", "Turns it into a fatty acid"], answer: 1, explain: "PRODH oxidizes proline to pyrroline-5-carboxylate (P5C), which feeds glutamate and the TCA cycle for energy." },
      { q: "How does SIRT1 activate the antioxidant enzyme SOD2?", options: ["By phosphorylating it", "By deacetylating it (NAD⁺-dependent)", "By cleaving it", "By adding a sulfate"], answer: 1, explain: "SIRT1 is an NAD⁺-dependent deacetylase; removing acetyl groups from SOD2 activates it." },
      { q: "Low placental proline was linked to...", options: ["High birth weight", "Poor vascularization and low birth weight", "Excess collagen", "More insulin"], answer: 1, explain: "Insufficient proline meant impaired placental angiogenesis and higher low-birth-weight risk." }

// Global guidance shown on the home page
window.GUIDANCE = {
  title: "Final-Week Journal Presentation",
  course: "General Biochemistry · VET67-206 · Week 15",
  intro: "Each group presents one current research paper that shows the biochemistry of this course at work in a real, medical or veterinary-relevant context. The goal is not to master every specialized method, but to connect what you studied this term to a published investigation and explain what was found and why it matters.",
  schedule: "10 min presentation + 10 min Q&A · Last week, lab practice section (13.00–16.00).",
  tips: [
    "Open with a one-slide method primer — explain your paper's main technique in plain terms.",
    "Use a clear arc: Hook → background & biochemistry link → key results (figures) → what it means → limitations.",
    "Lead with the biochemistry from class. Foreground the pathways and molecules we studied; treat unfamiliar methods lightly."
  ]
};

</script>

<script>
(function(){
  const P = window.PAPERS, G = window.GUIDANCE;
  const view = document.getElementById('view');
  const nav = document.getElementById('paper-nav');
  document.getElementById('site-title').textContent = G.title + " — Study Guide";
  document.getElementById('site-sub').textContent = G.course;
  document.title = "VET67-206 · " + G.title;

  // build nav
  const homeBtn = mkNavBtn("★ Home", null);
  nav.appendChild(homeBtn);
  P.forEach(p=>nav.appendChild(mkNavBtn(p.letter, p.letter, p.group)));
  nav.appendChild(mkNavBtn("Glossary", "__glossary"));

  function mkNavBtn(label, key, grp){
    const b=document.createElement('button');
    b.dataset.key = key===null? "__home" : key;
    if(grp){ b.innerHTML = label + ' <span class="g">G'+grp+'</span>'; }
    else b.textContent = label;
    b.onclick=()=>route(b.dataset.key);
    return b;
  }
  function setActive(key){
    [...nav.children].forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  }

  function route(key){
    window.scrollTo({top:0,behavior:'smooth'});
    if(key==="__home"||!key){ setActive("__home"); renderHome(); return; }
    if(key==="__glossary"){ setActive("__glossary"); renderGlossary(); return; }
    setActive(key);
    renderPaper(P.find(p=>p.letter===key));
  }

  function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

  function renderHome(){
    let tips = G.tips.map(t=>`<li>${esc(t)}</li>`).join('');
    let cards = P.map(p=>`
      <button class="pcard" onclick="__go('${p.letter}')">
        <div class="row1"><span class="badge">${p.letter}</span>
          <span class="grp">Group ${p.group}</span></div>
        <h3>${esc(p.title)}</h3>
        <div class="tagline">${esc(p.tag)}</div>
      </button>`).join('');
    view.innerHTML = `
      <div class="home-intro">
        <p>${esc(G.intro)}</p>
        <p class="sched"><strong>Schedule:</strong> ${esc(G.schedule)}</p>
        <h4 class="sec" style="margin-top:16px">How to give a good talk</h4>
        <ul class="tips">${tips}</ul>
      </div>
      <h4 class="sec">Choose your paper</h4>
      <div class="grid">${cards}</div>`;
  }

  function renderPaper(p){
    view.innerHTML = `
      <button class="back-btn" onclick="__go('__home')">← All papers</button>
      <div class="paper-head">
        <span class="badge">${p.letter}</span>
        <div>
          <h2>${esc(p.title)}</h2>
          <div class="tagline">${esc(p.tag)}</div>
        </div>
        <span class="grp">Group ${p.group}</span>
      </div>
      <div class="cite">${esc(p.citation)}</div>
      <div class="tabs" id="ptabs">
        <button data-t="overview" class="active">Overview</button>
        <button data-t="figures">Figure walkthrough</button>
        <button data-t="cards">Flashcards</button>
        <button data-t="quiz">Self-quiz</button>
      </div>
      <div id="pbody"></div>`;
    const tabs=[...document.querySelectorAll('#ptabs button')];
    tabs.forEach(t=>t.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');paperTab(p,t.dataset.t);});
    paperTab(p,'overview');
  }

  function paperTab(p,t){
    const body=document.getElementById('pbody');
    if(t==='overview'){
      body.innerHTML=`
        <div class="panel">
          <div class="msg"><span class="lab">Message to deliver</span>${esc(p.message)}</div>
          <div class="primer">${esc(p.primer)}</div>
          <h4 class="sec" style="margin-top:18px">Set aside (don't over-invest)</h4>
          <div class="aside-box">${esc(p.setAside)}</div>
        </div>`;
    } else if(t==='figures'){
      const steps=p.figures.map((f,i)=>`
        <div class="step"><div class="num">${i+1}</div>
          <div><span class="fig">${esc(f.fig)}</span> — <span class="figlab">${esc(f.label)}</span>
          <div class="txt">${esc(f.text)}</div></div></div>`).join('');
      body.innerHTML=`<div class="panel"><h4 class="sec">Present these, in this order</h4><div class="steps">${steps}</div></div>`;
    } else if(t==='cards'){
      const cards=p.concepts.map((c,i)=>`
        <div class="flip" onclick="this.classList.toggle('flipped')">
          <div class="flip-in">
            <div class="face front"><div class="term">${esc(c.term)}</div><span class="hint">tap to flip</span></div>
            <div class="face back"><div class="term">${esc(c.term)}</div>${esc(c.def)}</div>
          </div></div>`).join('');
      body.innerHTML=`<div class="panel"><h4 class="sec">Key concepts — tap to reveal</h4><div class="cards">${cards}</div></div>`;
    } else if(t==='quiz'){
      renderQuiz(p,body);
    }
  }

  function renderQuiz(p,body){
    body.innerHTML=`<div class="panel"><h4 class="sec">Test yourself</h4><div id="qlist"></div>
      <div class="quiz-score" id="qscore"></div></div>`;
    const list=document.getElementById('qlist');
    const state={answered:0,correct:0,total:p.quiz.length};
    p.quiz.forEach((item,qi)=>{
      const wrap=document.createElement('div');wrap.className='q';
      wrap.innerHTML=`<div class="qtext">${qi+1}. ${esc(item.q)}</div>`;
      const opts=[];
      item.options.forEach((o,oi)=>{
        const btn=document.createElement('button');btn.className='opt';btn.textContent=o;
        btn.onclick=()=>{
          if(wrap.dataset.done)return;
          wrap.dataset.done="1";state.answered++;
          opts.forEach(b=>b.disabled=true);
          if(oi===item.answer){btn.classList.add('correct');state.correct++;}
          else{btn.classList.add('wrong');opts[item.answer].classList.add('correct');}
          exp.classList.add('show');
          if(state.answered===state.total)
            document.getElementById('qscore').textContent=`Score: ${state.correct} / ${state.total}`;
        };
        opts.push(btn);wrap.appendChild(btn);
      });
      const exp=document.createElement('div');exp.className='explain';exp.textContent="Why: "+item.explain;
      wrap.appendChild(exp);list.appendChild(wrap);
    });
  }

  function renderGlossary(){
    const all=[];
    P.forEach(p=>p.concepts.forEach(c=>all.push({t:c.term,d:c.def,p:p.letter,g:p.group})));
    all.sort((a,b)=>a.t.localeCompare(b.t));
    view.innerHTML=`
      <button class="back-btn" onclick="__go('__home')">← All papers</button>
      <h2 style="margin:4px 0 4px">Glossary &amp; key molecules</h2>
      <p style="color:var(--muted);font-size:.9rem;margin-top:0">Every enzyme, pathway, and term across the seven papers. Search to filter.</p>
      <input class="search" id="gsearch" placeholder="Search terms, enzymes, pathways…">
      <div id="glist"></div>`;
    const glist=document.getElementById('glist');
    function draw(f){
      const q=(f||"").toLowerCase();
      glist.innerHTML=all.filter(x=>!q||x.t.toLowerCase().includes(q)||x.d.toLowerCase().includes(q))
        .map(x=>`<div class="gitem"><span class="gt">${esc(x.t)}</span>
          <span class="gp">Paper ${x.p} · Group ${x.g}</span>
          <div class="gd">${esc(x.d)}</div></div>`).join('') || `<p style="color:var(--muted)">No matches.</p>`;
    }
    draw("");
    document.getElementById('gsearch').oninput=e=>draw(e.target.value);
  }

  window.__go=route;
  route("__home");
})();
</script>
</body>
</html>
